<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000103">
  <meta name="description" content="A private sky.">
  <title>The Sky We Made</title>
  <style>
    :root{--void:#000103;--navy:#050914;--white:#f5f6ff;--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--white);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    body{background:radial-gradient(ellipse at 50% 45%,#030612 0%,#000104 55%,#000001 100%)}
    #sky{position:fixed;inset:0;opacity:0;transition:opacity 2200ms ease}
    #sky.ready{opacity:1}
    canvas{display:block;width:100%;height:100%;outline:0}

    #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 32%,rgba(0,0,0,.66) 100%)}
    #grain{position:fixed;inset:-4px;pointer-events:none;z-index:1;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:180px 180px;animation:grain-shift 700ms steps(4) infinite}
    @keyframes grain-shift{0%{transform:translate(0,0)}25%{transform:translate(-1%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(-1%,-1%)}100%{transform:translate(0,0)}}
    @media(prefers-reduced-motion:reduce){#grain{animation:none}}

    #intro{position:fixed;z-index:2;left:50%;top:45%;transform:translate(-50%,-50%);margin:0;opacity:0;pointer-events:none;font:italic 400 clamp(18px,4.6vw,27px)/1 var(--serif);letter-spacing:.02em;color:rgba(245,246,255,.92);text-shadow:0 0 25px #000;transition:opacity 700ms ease;white-space:nowrap}
    #intro.show{opacity:1}
    #hint{position:fixed;z-index:2;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;opacity:0;pointer-events:none;font:10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:rgba(245,246,255,.4);transition:opacity 900ms ease;white-space:nowrap}
    #hint.show{opacity:1;animation:hint-breathe 3.4s ease-in-out .9s infinite}
    @keyframes hint-breathe{0%,100%{opacity:1}50%{opacity:.45}}

    .label{position:fixed;z-index:2;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;transition:opacity 400ms ease;color:white;text-shadow:0 0 15px #000;white-space:nowrap}
    .label strong{display:block;font:500 10px/1 var(--sans);letter-spacing:.38em}
    .label span{display:block;margin-top:7px;font:italic 12px/1 var(--serif);letter-spacing:.04em;color:rgba(255,255,255,.52)}
    #ours-label strong{font-size:9px;letter-spacing:.42em;color:#f5dfaa}
    #ours-label span{color:rgba(245,223,170,.58)}

    #message{position:fixed;z-index:2;left:0;top:0;transform:translate(-50%,-135%);width:max-content;max-width:min(76vw,280px);opacity:0;pointer-events:none;text-align:center;color:rgba(255,255,255,.96);font:italic 16px/1.5 var(--serif);text-shadow:0 2px 22px #000;transition:opacity 350ms ease}
    #message.show{opacity:1}
    #message .tick{display:block;width:1px;height:13px;margin:0 auto 6px;background:rgba(255,255,255,.32)}

    #ending{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:30px;pointer-events:none;opacity:0;transition:opacity 900ms ease;background:radial-gradient(circle at center,rgba(3,4,10,.18),rgba(3,4,10,.34))}
    #ending.show{opacity:1}
    #ending p{margin:0;max-width:470px;text-align:center;color:rgba(255,247,225,.96);font:italic 400 clamp(17px,4.2vw,24px)/1.35 var(--serif);opacity:0;transform:translateY(5px);transition:opacity 900ms ease,transform 900ms ease}
    #ending.show p{opacity:1;transform:none}
    #ending p:nth-child(2){transition-delay:1500ms}
    #ending p:nth-child(3){transition-delay:3000ms;font-size:14px;color:rgba(255,247,225,.55);letter-spacing:.06em}

    #audio{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:30px;height:30px;border:1px solid rgba(245,246,255,.15);border-radius:50%;background:rgba(245,246,255,.025);color:rgba(245,246,255,.45);font:13px var(--sans);opacity:0;transition:opacity 700ms ease;z-index:3}
    #audio.show{opacity:1}
    #fallback{display:none;position:fixed;inset:0;padding:14vh 9vw;overflow:auto;background:#000103;color:#f5f6ff}
    #fallback.show{display:block}
    #fallback h1{font:italic 400 32px var(--serif);margin:0 0 12px}
    #fallback p{font:15px/1.65 var(--sans);color:rgba(245,246,255,.68)}
    #fallback .const{margin-top:28px}.const b{font:11px var(--sans);letter-spacing:.2em}.const span{display:block;margin-top:4px;font:italic 17px var(--serif)}
    #fallback .end{margin-top:38px}.end p{font:italic 19px var(--serif);color:rgba(255,247,225,.9)}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:500px){.label strong{font-size:9px;letter-spacing:.28em}.label span{font-size:11px}.label{transform:translate(-50%,-50%)}}
    @media(prefers-reduced-motion:reduce){#sky{transition-duration:300ms}#intro,#hint,#ending,#message{transition-duration:300ms}#ending p{transition-duration:500ms}#ending p:nth-child(2){transition-delay:700ms}#ending p:nth-child(3){transition-delay:1400ms}}
  </style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <p id="intro"></p>
  <p id="hint">Drag to explore · Tap a star</p>
  <div id="message" role="status"></div>
  <div id="label-aquarius" class="label"><strong>AQUARIUS</strong><span>Khwahish</span></div>
  <div id="label-libra" class="label"><strong>LIBRA</strong><span>Palak</span></div>
  <div id="label-taurus" class="label"><strong>TAURUS</strong><span>02 MAY · THE DAY WE CHOSE EACH OTHER</span></div>
  <div id="ours-label" class="label"><strong>OUR CONSTELLATION</strong><span>the part we made</span></div>
  <div id="ending"></div>
  <button id="audio" aria-label="Pause song" aria-pressed="true">♪</button>
  <audio id="song" src="song.mp3" preload="metadata" loop playsinline></audio>
  <div id="sr-summary" class="sr"></div>
  <div id="fallback">
    <h1 id="fb-title"></h1><p id="fb-body"></p><p id="fb-close"></p>
    <div id="fb-constellations"></div><div id="fb-ending" class="end"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
